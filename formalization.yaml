# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

# Initial Palomar provenance for DomainTheory, recorded 2026-10-20 before
# any DomainTheory Lean development or modification of the vendored code.
# This file describes the derivative starting point only: DomainTheory is
# not yet Palomar-registered and has no compared claim, Challenge/Solution
# pair, or comparator.json yet. The five Palomar registrations cited below
# belong to the upstream repositories and are quoted from them at the
# vendored revisions; they are not transferred to DomainTheory.

project:
  name: "DomainTheory — derivative development from five registered Scott formalizations (initial provenance)"
  description: >-
    A Lean 4 / mathlib development of Scott domain theory built as a
    derivative work from straight file copies, vendored under vendor/ on
    2026-10-20, of five same-author formalizations: scott1972 (Continuous
    Lattices, Theorem 4.4), scott1976 (Data Types as Lattices),
    scott1980 (PRG-19 neighbourhood systems, Theorem 8.8 first
    sentence), scott1982 (information systems, Theorem 7.2 first
    sentence), and scott_models (cross-presentation bridges). Each base
    is registered with Palomar on its own, as specified in that repo at
    the vendored revision (see PROVENANCE.md for the registration table
    and vendor/FROZEN.txt for the frozen revisions). The vendored code
    is expected to change and diverge from upstream as DomainTheory
    develops; the frozen revisions are provenance before modification,
    not a guarantee of continued identity with upstream. DomainTheory
    itself has no Palomar registration and no statement of record yet.
    The five libraries were assembled on 2026-10-20 into the single
    DomainTheory Lean library under renamed modules/namespaces
    (DomainTheory.ContinuousLattice, DataTypesAsLattices, Neighborhood,
    InformationSystems, BridgeTheorems), pinned to Lean/Mathlib
    v4.35.0; lake build is green with no sorry (see PROVENANCE.md,
    Assembly). Dana Scott did not participate in or endorse the
    vendored formalizations or this derivative work.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, cs.PL, math.LO]
  msc2020: ["68Q55", "06B35", "03B70"]

status:
  scope: >-
    Initial provenance (2026-10-20), plus the same-day assembly of the
    five vendored libraries into the single DomainTheory library
    (DomainTheory/ with root DomainTheory.lean, Lean/Mathlib v4.35.0,
    lake build green). main_results lists the assembled declarations
    under their new DomainTheory names; no DomainTheory Palomar claim
    has been selected and comparator.json does not exist yet, so these
    are development results, not compared targets. Axiom profile is
    the union of the vendored bases' profiles.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "DomainTheory.ContinuousLattice.theorem_4_4"
      file: "DomainTheory/ContinuousLattice/FunctionSpaceTower.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "DomainTheory.InformationSystems.InfoSys.theorem_7_2"
      file: "DomainTheory/InformationSystems/Theorem72.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "DomainTheory.BridgeTheorems.presentation_domains_equiv"
      file: "DomainTheory/BridgeTheorems/PresentationDomains.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]

fidelity:
  divergences: >-
    Provenance before modification: the vendored trees are the upstream
    tracked trees at the revisions in vendor/FROZEN.txt, copied without
    .git directories. Deviations already present at setup: nested
    .gitignore files under vendor/ were removed, and top-level
    boilerplate/scripts were copied from scott_models and repointed to
    DomainTheory (see PROVENANCE.md). All further divergence — adapted
    Lean code, moved modules, changed statements — will be DomainTheory
    modifications attributable to this repository's git history, and
    must not be read back onto the upstream repos or their Palomar
    entries. The vendored revision of each base is its upstream git
    HEAD at copy time and is not asserted to be the pinned commit
    Palomar preserves for that base's registration.

