  - F.3.2 Semantics of Programming Languages — Denotational semantics
  - F.3.1 Specifying and Verifying and Reasoning about Programs — Mechanical verification
  - F.4.1 Mathematical Logic — Mechanical theorem proving; Lambda calculus and related systems
  - D.3.1 Formal Definitions and Theory — Semantics
status:
  scope: 'Union of the five bases in date order (1972, 1976, 1980, 1982, bridges). Each base scope, renamed
    to DomainTheory modules:


    [1972 / scott1972, PALOMAR-2026-08-24-000003 v2] Complete for the compared claim and the underlying
    DomainTheory.ContinuousLattice library it uses. Theorem 4.4 is the compared declaration theorem_4_4:
    for a continuous lattice D₀ and projection j₀, the inverse limit D_∞ of the function-space tower is
    a continuous lattice homeomorphic to [D_∞ → D_∞]. The Homeomorph names Scott''s product/subspace inverse-limit
    topology and Definition 3.1 pointwise function-space topology explicitly. Challenge.lean fixes the
    function-space lattice by pointwise order and pointwise suprema, the inverse-limit lattice by coordinatewise
    order and infima, and the projection tower by the recursive Proposition 3.7 conjugation formulas.
    The broader paper (Theorems 2.12, 3.3, 4.1, etc.) is formalized in the same library but is not part
    of the advertised Comparator result; the additional Comparator theorem targets are proof obligations
    used only to lock these concrete definition bodies.


    [1976 / scott1976, PALOMAR-2026-08-25-000004 v1] The library is a 1:1 onto translation of the numbered
    items in Scott 1976, except that plusR uses the doubly strict conditional of (4.4) in place of the
    ordinary conditional written in displayed (4.10). Comparator selects the 63 theorem declarations and
    70 definitions named in comparator.json. That match establishes those selected statements; further
    library companions are not all compared.


    [1980 / scott1980, PALOMAR-2026-08-24-000001 v2] Complete for the three compared embedding results.
    The principal sourced declaration is theorem_8_8: for every countable neighbourhood system D one has
    D ⊴ U, i.e. D ≅ D'' for some subsystem D'' ◁ U. This is Scott''s first Theorem 8.8 sentence. The other
    compared declarations are two new formal corollaries obtained by specialization: Example 1.5 (`P4_embeds`)
    and Exercise 7.22''s system S (`Ssys_embeds`). Scott defines those systems but does not separately
    state these embeddings. Challenge.lean also locks the filter-element order (element_le), the Definition
    8.7 membership predicate UMem, the non-emptiness of the master token sets, and the concrete value
    of U. The broader book is formalized in the same library but is not part of the advertised Comparator
    result; Exercise 8.17 Part 2 remains a documented deferral. Additional Comparator theorem targets
    are proof obligations used only to lock these concrete definition bodies.


    [1982 / scott1982, PALOMAR-2026-08-24-000005 v1] Complete for the compared claim. theorem_7_2 is the
    compared declaration: approximable maps A → B are exactly the elements of the Definition 7.1 function-space
    system |A → B|. That is Scott''s first Theorem 7.2 sentence only. Challenge.lean locks the information-system
    axioms, the carrier-inclusion order on elements, set-level entailment, approximable maps, and the
    concrete Definition 7.1 data (FunToken, FunCon, FunEnt, functionSystem). The broader paper is formalized
    in the same library but is not part of the advertised Comparator result. Additional Comparator theorem
    targets are proof obligations used only to lock these concrete definition bodies.


    [bridge / scott_models, PALOMAR-2026-08-25-000003 v1] Complete for the compared family, with no unproved
    step in the DomainTheory.BridgeTheorems proof modules. The 1980 ↔ 1982 coding, the round continuous-lattice
    identification D ≃o RoundInfoSysElement, and the S-expression instance (sexNeighborhoodIso, sexIdealIso,
    sexDomainEquationIso) are stated and proved. The rest of the DomainTheory.BridgeTheorems library (general
    constructions, ScottMap conjugation, LRSOD) is out of the compared family. Nothing in the compared
    statements is imported from a prior Palomar entry.'
