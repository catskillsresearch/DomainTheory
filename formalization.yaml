    same class of domains (via ideal completion and the Scott topology), as already remarked by Scott
    (1982) for the neighbourhood / information pair. This package independently proves the named order
    isomorphisms (including D ≃o RoundFilter ≃o RoundInfoSysElement), not a functorial equivalence of
    categories. The equivalence is not claimed as original.'
  base: scott_models
