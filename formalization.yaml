review:
  status: self-assessed
  reviewers:
  - Lars Warren Ericson
  notes: 'Union of the five self-assessed bases; no external review of any base or of DomainTheory, and
    no review or endorsement by Dana Scott. DomainTheory itself has not been submitted to Palomar.


    [1972 / scott1972] The author directed and reviewed the development. No external review of the Lean
    source, and no review or endorsement by Dana Scott. Every proof step is checked by the Lean kernel.


    [1976 / scott1976] The author directed and reviewed the development. No external review of the Lean
    source, and no review or endorsement by Dana Scott. Every proof step is checked by the Lean kernel.


    [1980 / scott1980] The author directed and reviewed the development. No external review of the Lean
    source, and no review or endorsement by Dana Scott. Every proof step is checked by the Lean kernel.
    Palomar''s automated v1 review identified two non-blocking presentation/fidelity warnings; this version
    addresses both before a fresh v2 review.


    [1982 / scott1982] The author directed and reviewed the development. No external review of the Lean
    source, and no review or endorsement by Dana Scott. Every proof step is checked by the Lean kernel.


    [bridge / scott_models] The author directed and reviewed the development as it was produced. No external
    or independent review has been performed, and no mathematician other than the author has read the
    Lean source. Every compared declaration is checked by Lean against Mathlib and the pinned sibling
    packages.'
known_gaps:
- '[DomainTheory] No comparator.json, Challenge.lean, or Solution.lean yet: what would be Palomared is
  this union, but the merged Comparator configuration (the union of the five vendor/*/comparator.json
  name lists, renamed to DomainTheory declarations) and Challenge/Solution pair have not been authored,
  so scripts/palomar_preflight.sh cannot pass yet.'
- '[1980 / scott1980] Palomar compares the first sentence of Theorem 8.8 (`theorem_8_8`) plus the new
  formal corollaries `P4_embeds` and `Ssys_embeds`. The effective second sentence (`theorem_8_8_b`) and
  finitary-projection third sentence (`theorem_8_8_c`) are in the library, not in Comparator.'
- '[1980 / scott1980] Exercise 8.17 Part 2 (whether U+U, U×U, or U→U is isomorphic to U) is deliberately
  deferred. Scott flagged the function-space case as open.'
- '[1980 / scott1980] NeighborhoodSystem, Element, Subsystem, and the PartialOrder instance are structures
  or instances and cannot be listed as ordinary Comparator definition targets. Their reached structure
  declarations, selected proof fields (including concrete master-nonemptiness proofs), and the named relation
  element_le are compared instead.'
- '[1982 / scott1982] Palomar compares only the first sentence of Theorem 7.2 (`theorem_7_2`). The apply
  and curry clauses of that numbered theorem are in the library, not in Comparator.'
- '[1982 / scott1982] InfoSys, Element, ApproximableMap, and the PartialOrder instance are structures
  or instances and cannot be Comparator-locked. Their proof fields and the named order / function-system
  axiom theorems are locked instead.'
limitations:
- '[1972 / scott1972] The historical introduction treats Scott''s D_∞ construction as a landmark early
  model but does not establish comparative priority over other early models of the untyped lambda calculus.'
- '[1972 / scott1972] The Comparator-compared family is Theorem 4.4 and the definitions it mentions, not
  the full Scott 1972 inventory in arxiv.md.'
- '[1972 / scott1972] The compared theorem depends on propext, Classical.choice, and Quot.sound. Classical.choice
  enters via Scott-open sets and non-decidable predicates.'
- '[1972 / scott1972] Challenge.lean states the claim with deliberate sorries; Solution.lean and DomainTheory.ContinuousLattice/ContinuousLattice/*
  supply the proofs.'
- '[1976 / scott1976] Comparator selects the 63 theorem declarations and 70 locked definitions named in
  comparator.json. A match establishes those selected statements, not every informal clause of every numbered
  theorem. Further companions remain in the library.'
- '[1976 / scott1976] Challenge.lean may contain deliberate sorries; Solution.lean and DomainTheory.DataTypesAsLattices/DataTypesAsLattices/*
  must not.'
- '[1976 / scott1976] The locked coproduct plusR implements Scott''s displayed (4.10) with the doubly
  strict conditional dcondSet of (4.4), not the ordinary McCarthy conditional condSet written in that
  equation. On a mixed tag containing both zero and a successor, plusR returns topElem rather than the
  union of the two injections. This matches bool in (4.3), which (4.8)–(4.10) generalize, and is required
  for Theorem 4.5 (a ⊕ b is a retract). Displayed (4.10) is therefore not a symbol-for-symbol 1:1 transcription.'
- '[1976 / scott1976] Compared substitution is theorem_1_3 (unary composition), theorem_1_3_tuple (binary),
  and theorem_1_3_nary (ternary), not arbitrary finite-arity substitution.'
- '[1976 / scott1976] theorem_1_5 proves continuity of extend f for every f, a strengthening of Scott''s
  hypothesis that f is continuous; theorem_1_5_extends restores that hypothesis for agreement on the subspace.'
- '[1976 / scott1976] theorem_2_2 is a conditional semantic congruence: it assumes the renamed bodies
  already have equal interpretations and lifts that equality through lambda. It is not source-level alpha
  conversion from a freshness hypothesis.'
- '[1976 / scott1976] theorem_4_6_limit compares an inclusion-preserving bijection with the inverse limit
  (an order isomorphism), not a homeomorphism.'
- '[1976 / scott1976] theorem_6_5 is the specialization of Scott''s parameterized characterization to
  the representative target succSet topElem.'
- '[1980 / scott1980] The Comparator-compared embedding results are the first sentence of Theorem 8.8
  (general universality D ⊴ U) and the two new formal corollaries P4_embeds and Ssys_embeds. The full
  three-sentence theorem and the PRG-19 inventory in arxiv.md are not Comparator scope.'
- '[1980 / scott1980] The compared embedding theorems depend on propext, Classical.choice, and Quot.sound.
  Classical.choice enters via Countable.nonempty surjections and Mathlib''s order instance on ℚ.'
- '[1980 / scott1980] Challenge.lean states the claim with deliberate sorries; Solution.lean and DomainTheory.Neighborhood/Neighborhood/*
  supply the proofs.'
- '[1982 / scott1982] The Comparator-compared family is the first sentence of Theorem 7.2 and the definitions
  it mentions, not the full paper inventory in arxiv.md.'
- '[1982 / scott1982] The compared theorem is intended to depend only on propext and Quot.sound. Challenge.lean
  restates the choice-free Finset union locally so its import closure is Mathlib-only.'
- '[1982 / scott1982] The compared statements assume DecidableEq on both token types. Scott''s informal
  account is for arbitrary information systems; this is an implementation restriction needed for Finset
  operations, not an extra mathematical hypothesis on consistency or entailment.'
- '[1982 / scott1982] Challenge.lean states the claim with deliberate sorries; Solution.lean and DomainTheory.InformationSystems/*
  supply the proofs.'
- '[bridge / scott_models] The mathematical equivalence of the three presentations is prior (Scott 1982;
  folklore) and is not claimed as original. Separately: a search of Mathlib, Tau Ceti, and public Lean
  domain-theory repositories did not locate a prior Lean development of the cross-presentation bridges
  of all three presentations. That is a search note about Lean treatment, not a provenance claim, and
  it can be empty in the sense that no such development was located, not that none exists unpublished.
  Palomar is not a novelty stamp.'
- '[bridge / scott_models] The compared declarations are permitted to depend on propext, Quot.sound and
  Classical.choice. The 1980 ↔ 1982 maps, presentation_domains_equiv, sexNeighborhoodIso, sexIdealIso,
  and sexDomainEquationIso audit to {propext, Quot.sound}. Classical.choice is listed because the 1972
  topological definition of ≪ is the classical frontier elsewhere in the library. There is no sorry outside
  the deliberate holes in Challenge.lean, no project-defined axiom, and no native_decide.'
- '[bridge / scott_models] Challenge.lean states the family but does not prove it; that is the Comparator
  convention. Solution.lean re-exports the DomainTheory.BridgeTheorems proofs. Challenge restates the
  type surface (InfoSys, NeighborhoodSystem, NbhdBasis, IsContinuousLattice, round filters, TreeToken
  / SumToken / ProdToken, treeSystem) under the sibling namespaces so that Comparator can match names
  and types; it is not a copy of the DomainTheory.BridgeTheorems proof modules.'
- '[bridge / scott_models] The compared claim is the named bridges, not “we formalized Scott 1972 / PRG-19
  / ICALP 1982,” not LRSOD / D∞ ≅ [D∞ → D∞], and not a Mathlib or Tau Ceti ingest.'
- '[bridge / scott_models] The three vendor/ trees are modified copies of the frozen sibling revisions
  in vendor/FROZEN.txt (not bit-identical checkouts). See related_formalizations for the Palomar-kit omissions
  and the scott1982 Lean patches.'
- '[DomainTheory] This union records derived-from provenance and the assembled declarations; it does not
  transfer the five upstream Palomar registrations to DomainTheory, and the frozen vendor revisions are
  not asserted to be Palomar''s pinned commits for those entries.'
alignment:
  sections:
  - base: scott1972
    date_order: '1972'
    namespace: DomainTheory.ContinuousLattice
    palomar_registration: PALOMAR-2026-08-24-000003 (version 2, as specified in vendor/scott1972)
    vendor_comparator: vendor/scott1972/comparator.json
    statements:
    - source: 'sources/ScottContinLatt1972.md, Theorem 4.4: The inverse limit D_∞ of the recursively defined
        sequence ⟨D_n, j_n⟩_{n=0}^∞ of function spaces is not only a continuous lattice, but it is also
        homeomorphic to its own function space [D_∞ → D_∞].'
      lean: theorem_4_4
      module: Challenge (statement), FunctionSpaceTower.lean (proof)
      status: proved
      note: Challenge quotes that sentence. The library proves it via Proposition 4.1 and the maps i_∞,
        j_∞ written in the proof of 4.4. Its explicit Homeomorph uses inverseLimitTopology and scottMapInducedPiTopology.
    - source: 'Scott 1972, Definition 2.3: continuous lattice'
      lean: IsContinuousLattice
      module: Challenge (definition), WayBelow.lean (proof development)
      status: proved
      note: Compared as a definition.
    - source: 'Scott 1972, §2: way-below relation x ≪ y'
      lean: WayBelow
      module: Challenge (definition), WayBelow.lean
      status: proved
      note: Compared as a definition.
    - source: 'Scott 1972, §2: Scott-open sets'
      lean: ScottOpen
      module: Challenge (definition), WayBelow.lean
      status: proved
      note: Compared as a definition.
    - source: 'sources/ScottContinLatt1972.md, Definition 3.1: [X → Y] is the space of all continuous
        functions f : X → Y endowed with the product topology (pointwise convergence). Theorem 3.3: on
        continuous lattices the lattice topology agrees with the product topology.'
      lean: ScottMap
      module: Challenge (definition), FunctionSpaces.lean
      status: proved
      note: Compared as a definition.
    - source: 'Scott 1972, Theorem 3.3: [D → D''] is a complete lattice'
      lean: ScottMap.instCompleteLattice
      module: Challenge (concrete construction), FunctionSpaces.lean (proof)
      status: proved
      note: Comparator checks the concrete body generated from pointwise order (including its explicitly
        defined strict relation) and pointwise arbitrary suprema. The pointwise order laws, strict-order
        characterization, continuity, and least-upper-bound obligations are theorem holes in Challenge.
    - source: 'Scott 1972, §2: induced (Scott) topology on a lattice'
      lean: scottTopologicalSpace
      module: Challenge (definition), Specialization.lean
      status: proved
      note: Compared as a definition.
    - source: 'Scott 1972, Definition 3.6: retraction / projection'
      lean: IsContinuousLatticeProjection
      module: Challenge (definition), FunctionSpaces.lean
      status: proved
      note: Structure compared via the theorem-type worklist, not as a definition hole (Comparator only
        accepts defs in definition_names).
    - source: 'Scott 1972, §4: inverse limit of compatible sequences'
      lean: InverseLimit
      module: Challenge (definition), InverseLimits.lean
      status: proved
      note: Compared as a definition.
    - source: 'Scott 1972, §4: inverse limit as a subspace of the product of the D_n'
      lean: inverseLimitTopology
      module: Challenge (definition), InverseLimits.lean
      status: proved
      note: Compared as a definition.
    - source: 'Scott 1972, Definition 3.1: pointwise product topology on [D → D'']'
      lean: scottMapInducedPiTopology
      module: Challenge (definition), FunctionSpaces.lean
      status: proved
      note: Compared as a definition.
    - source: 'Scott 1972, §4: function-space tower D_{n+1} = [D_n → D_n]'
      lean: DInf
      module: Challenge (definition), FunctionSpaceTower.lean
      status: proved
      note: DInf is the inverse limit of the tower; DInfFn is [D_∞ → D_∞].
  - base: scott1976
    date_order: '1976'
    namespace: DomainTheory.DataTypesAsLattices
