automation:
  methods:
    - method: agent
      models: ["Cursor agent (scaffolding session, 2026-10-20)"]
      framework: "Cursor"
      role: >-
        Repository scaffolding only: copying boilerplate from
        scott_models, vendoring the five base repos without .git,
        removing nested .gitignore files, repointing top-level
        scripts to DomainTheory, and drafting this initial Palomar
        provenance (PROVENANCE.md, formalization.yaml) under the
        author's direction. No Lean was written or modified.
    - method: manual
      models: []
      role: >-
        The author directed the vendoring and provenance setup and
        takes sole responsibility for the mathematical content.
        Automation history of the vendored code as copied is recorded
        in each vendor/*/formalization.yaml and is not claimed here.
  notes: >-
    This provenance was set up before modification of the derived
    code. Future DomainTheory automation must be appended here (and
    in scripts/ai_model_cards.py) as the development proceeds.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed this setup. No external review,
    and no review or endorsement by Dana Scott. DomainTheory has not
    been submitted to or registered with Palomar; the five cited
    registrations were reviewed only as recorded in the vendored
    repos.

known_gaps:
  - >-
    No DomainTheory Challenge.lean, Solution.lean, or comparator.json
    exists yet, so scripts/palomar_preflight.sh cannot pass: it
    validates comparator.json and audits axioms for a compared claim
    that has not been chosen. Its vendor-revision step is satisfied by
    this file and its lake build step passes.
  - >-
    No statement of record or Palomar registration for DomainTheory.

limitations:
  - >-
    This file records derived-from provenance at copy time only. It
    does not claim the vendored repos' compared theorems, axiom
    profiles, or Palomar registrations for DomainTheory, and the
    vendored revisions are not asserted to be Palomar's pinned
    commits for those entries.
  - >-
    As DomainTheory modifies the derived code, vendor/FROZEN.txt and
    this file's frozen revisions remain the pre-modification record;
    they will increasingly differ from the working tree.

alignment:
  namespace: "DomainTheory"
  statements: []
