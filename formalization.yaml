# DomainTheory formalization.yaml — UNION of the five vendored
# formalization.yaml files, in date order: scott1972 (1972), scott1976
# (1976), scott1980 (1980), scott1982 (1982), scott_models (bridges).
# What would be Palomared for DomainTheory is that union, under the
# renamed DomainTheory declarations/files (see PROVENANCE.md). Generated
# 2026-10-20 from vendor/*/formalization.yaml; DomainTheory is not yet
# Palomar-registered and has no comparator.json / Challenge / Solution yet.
version: v0.4
project:
  name: DomainTheory — Scott domain theory 1972–1982 with cross-presentation bridges (union of five registered
    formalizations)
  description: 'Union, in date order, of the five same-author Palomar-registered formalizations vendored
    under vendor/ and assembled into the single DomainTheory Lean library (Lean/Mathlib v4.35.0, lake
    build green, no sorry): (1) scott1972, Continuous Lattices, Theorem 4.4 (DomainTheory.ContinuousLattice);
    (2) scott1976, Data Types as Lattices (DomainTheory.DataTypesAsLattices); (3) scott1980, Lectures
    on a Mathematical Theory of Computation (PRG-19), Theorem 8.8 first sentence plus two corollaries
    (DomainTheory.Neighborhood); (4) scott1982, Domains for Denotational Semantics, Theorem 7.2 first
    sentence (DomainTheory.InformationSystems); (5) scott_models, cross-presentation bridge equivalences
    (DomainTheory.BridgeTheorems). This file is the union of the five vendor/*/formalization.yaml files:
    what would be Palomared for DomainTheory is that union, under the renamed DomainTheory declarations
    and file paths. DomainTheory itself is not yet Palomar-registered and has no comparator.json / Challenge
    / Solution pair yet; the five registrations cited in PROVENANCE.md and below remain the upstream repos''.
    Dana Scott did not participate in or endorse any of these formalizations or this derivative union.'
  authors:
  - Lars Warren Ericson
  license: Apache-2.0
  responsible_maintainers:
  - Lars Warren Ericson
repository:
  role: substantive-development
