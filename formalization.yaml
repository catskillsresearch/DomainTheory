fidelity:
  divergences: '[1972 / scott1972] Working source: sources/ScottContinLatt1972.md. Theorem 4.4 there is
    quoted in Challenge.lean and as theorem_4_4. Lean DInf is the inverse limit of the recursively defined
    sequence ⟨D_n, j_n⟩ of function spaces (D_{n+1} = [D_n → D_n], j_{n+1} = [j_n → j_n], D_0 and j_0
    given as in the paragraph above 4.4). Definition 3.1 takes [X → Y] with the product topology, represented
    by scottMapInducedPiTopology. The inverse limit uses inverseLimitTopology, the subspace topology induced
    from the Pi product of the stage Scott topologies. Proposition 4.1 follows Scott''s route: coordinatewise
    maximal extensions from Proposition 3.8 are made compatible by Lemma 3.9, yielding injectivity, and
    Theorem 2.12 supplies both the continuous-lattice result and the topology identification. Lemma 4.5
    follows Scott''s induction after moving a projection through a directed supremum. The source-topology
    homeomorphism uses Scott''s formulas i_∞(x) = ⨆ₙ (i_{n∞} ∘ x_{n+1} ∘ j_{∞n}) and j_∞(f) = ⨆ₙ i_{(n+1)∞}(j_{∞n}
    ∘ f ∘ i_{n∞}). Theorem 3.3 identifies the pointwise function topology with the lattice Scott topology.
    The abstract''s extra “and isomorphic” is theorem_4_4_orderIso and is not the numbered theorem.


    [1976 / scott1976] Working source: sources/Data_Types_as_Lattices_vision.md (transcription of sources/Data_Types_as_Lattices.pdf).
    Compared claims are the spanning theorems named in comparator.json. Remaining source-level notes are
    listed in known_gaps and in arxiv.md.


    [1980 / scott1980] Working source: sources/PRG19.md. Theorem 8.8 there is quoted in Challenge.lean
    and as theorem_8_8. Scott writes D ⊴ U; Lean Trianglelefteq is the prose before Lemma 6.15 (D ≅ D''
    for some D'' ◁ U). Scott''s standing assumption immediately before Definition 1.1 that the master
    token set Δ is non-empty is enforced by NeighborhoodSystem.master_nonempty. Definition 8.7 takes U
    as the non-empty finite unions of rational [r,s) inside [0,1). Lean UMem presents those unions by
    List (ℚ × ℚ) without per-pair bound side-conditions; U_mem_iff_scott in Definition87.lean proves this
    is equivalent to Scott''s literal per-pair 0 ≤ r < s ≤ 1 family. The principal compared theorem is
    the general (non-effective) first sentence of 8.8; P4_embeds and Ssys_embeds are new formal corollaries.
    The effective refinement theorem_8_8_b and the finitary-projection correspondence theorem_8_8_c are
    proved in the library but are not Comparator targets.


    [1982 / scott1982] Ground truth: sources/Domains_for_Denotational_Semantics.pdf. Theorem 7.2 is quoted
    in Challenge.lean and as theorem_7_2. Definition 7.1 tokens are consistent pairs (u, v). Consistency
    is Scott''s 7.1(iii). Entailment FunEnt is the constructive witness form of 7.1(iv): some s ⊆ w whose
    inputs are entailed by u'' and whose output-union entails v'', avoiding an undecidable filter on EntSet.
    Finset unions in the locked bodies are the choice-free ∪'' restated in Challenge.lean (and proved
    in DomainTheory.InformationSystems.Constructive). The apply / curry clauses of Theorem 7.2 are proved
    in the library and are not Comparator targets. The compared statements assume DecidableEq on token
    types so the Finset operations of Definitions 2.1, 5.1, and 7.1 can be formed.


    [bridge / scott_models] The informal note speaks of three presentations determining the same domains
    up to order isomorphism. The compared Lean statements are the named bridges, not a 2-categorical equivalence
    of the full categories with all morphisms. The 1972 corner is D ≃o RoundFilter ≃o RoundInfoSysElement,
    not raw |𝒟| ≃o D. Informal [u] is InfoSys.basicOpen; informal ↟a is wayBelowUp. DecidableEq on tokens
    (and on D for the ↟-coding) is required so InfoSys can use the choice-free Finset prelude. The sibling
    packages remain the per-paper remotes; this snapshot vendors modified copies in vendor/ (revisions
    and local patches: vendor/FROZEN.txt) and proves the maps between them.


    [DomainTheory assembly, 2026-10-20] Modules/namespaces renamed as in PROVENANCE.md (Assembly) and
    Lean/Mathlib v4.35.0 compatibility patches ported/applied there; vendor/ trees are unmodified. Declarations
    and files below use the new DomainTheory names.'
